TORCH_CPU_WHL_URL_AARCH64=https://download.pytorch.org/whl/cpu/torch-2.9.0%2Bcpu-cp312-cp312-manylinux_2_28_aarch64.whl

# CANN
CANN_VERSION=9.1.0-beta1

# libtorch_npu (Ascend Extension for PyTorch)
LIBTORCH_NPU_RELEASE_TAG=v26.1.0-beta.1-pytorch2.9.0
LIBTORCH_NPU_BRANCH=v2.9.0
LIBTORCH_NPU_SRC_URL=https://gitcode.com/Ascend/pytorch.git

# Third-party libraries
NLOHMANN_JSON_VERSION=3.11.3
