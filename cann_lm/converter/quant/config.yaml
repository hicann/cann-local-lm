dataset:
  # calibration set: jsonl under calibrate_sets/ (downloaded by download_dataset.py, swappable/multi-select)
  train_files:
    - "calibrate_sets/calibrate_coig_cqia.jsonl"
  ptq_samples: 256
cutoff_len: 1024

extra_training_config:
  fp16: true   # GPTQ runs/saves fp16 to avoid dopt's default fp32 doubling output size (CPU dispatch auto-falls-back to float32)
