[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cann-lm"
version = "0.1.0"
description = "CANN-LM Python bindings — ctypes passthrough over the C engine ABI"
requires-python = ">=3.8"
dependencies = []  # pure stdlib (ctypes) — zero runtime deps

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cann_lm = "cann_lm.cli:main"
"cann_lm.generate" = "cann_lm.generate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cann_lm*"]
