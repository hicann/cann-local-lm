# build.conf — 版本 + git 源 + 自定位派生路径
#
# 单一来源: _env_common.sh 先自定位 PROJECT_ROOT, 再 source 此文件; 各 set_env_*.sh / build.sh 经 _env_common 拿值.
# 环境变量优先: 任一变量若已在环境中设置, 此处不覆盖 (用 ${VAR:-default}).
#
# 不依赖外部预置的 sibling 仓环境: torchair / torch-delegate 由 build.sh deps clone 到
# ${PROJECT_ROOT}/deps/ 自建 (路径由 PROJECT_ROOT 派生, 不硬编码 /mnt/workspace).
# 对齐 torch-delegate 的 build.conf 模式 (版本号 + git 源 + 自定位派生).

# build.conf 自定位 PROJECT_ROOT (dirname → scripts 父目录; 任何 source 本文件的脚本都拿到)
_TD_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
export PROJECT_ROOT="${PROJECT_ROOT:-$(cd "$_TD_DIR/.." && pwd)}"
unset _TD_DIR

# ── 版本 (信息性, 供 build.sh 对齐 / 校验) ──
TORCH_DELEGATE_VERSION=0.1.0
TORCH_VERSION=2.9.0
TORCHAIR_VERSION=0.1
CANN_VERSION=9.2.0

# ── 上游仓 git 源 (前置安装用, 见 docs/build_guide.md; build.sh 不再 clone/构建它们) ──
TORCHAIR_GIT_URL="${TORCHAIR_GIT_URL:-https://gitcode.com/Ascend/torchair.git}"
TORCHAIR_GIT_TAG="${TORCHAIR_GIT_TAG:-}"                          # 空 = 默认分支
TORCH_DELEGATE_GIT_URL="${TORCH_DELEGATE_GIT_URL:-https://gitcode.com/shengnan666/torch-delegate.git}"
TORCH_DELEGATE_GIT_TAG="${TORCH_DELEGATE_GIT_TAG:-}"              # 空 = 默认分支

# ── C++ 三方库版本 (build_third_party.sh 下载 + 构建 → ${PROJECT_ROOT}/output/third_party) ──
NLOHMANN_JSON_VERSION="${NLOHMANN_JSON_VERSION:-3.11.3}"
GTEST_VERSION="${GTEST_VERSION:-1.14.0}"
MAKESELF_VERSION="${MAKESELF_VERSION:-2.5.0-patch1}"

# ── 自定位派生路径 (PROJECT_ROOT 由 _env_common.sh 注入; 不硬编码 /mnt/workspace) ──
DEPS_DIR="${DEPS_DIR:-${PROJECT_ROOT}/deps}"                       # 上游仓 clone + 构建根 (gitignored)
TORCHAIR_ROOT="${TORCHAIR_ROOT:-${DEPS_DIR}/torchair}"
TORCH_DELEGATE_HOME="${TORCH_DELEGATE_HOME:-${DEPS_DIR}/torch-delegate}"
CONVERTER_PYTHON="${CONVERTER_PYTHON:-${TORCH_DELEGATE_HOME}/.venv/bin/python}"
SOC_VERSION="${SOC_VERSION:-Ascend910_9362}"

# ── 外部预置 (不自动 source; 仅作 hint. 对齐 torch-delegate 靠外部 ASCEND_HOME_PATH 模式) ──
# CANN: 用户须先 source CANN set_env.sh 设 ASCEND_HOME_PATH (本机已装 cann-toolkit)
CANN_SET_ENV="${CANN_SET_ENV:-/home/developer/Ascend/cann/set_env.sh}"
# ③ NPU 用: 装 torch_npu 的系统 python (与 converter P1 venv 冲突, 须独立 python 环境; 仅量化需 NPU 加速时装)
# 不硬编码绝对路径: 由 _env_common.sh 的 _resolve_dopt_python 自动探测 (env 优先 → 候选+PATH 找能 import torch_npu 的); 换机器无需改
DOPT_PYTHON="${DOPT_PYTHON:-}"
