name: PR-pipeline_cann-local-lm

concurrency:
  max: 5
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  workflow_dispatch:
  pull_request_comment:
    types: [created]
    branches: [ '*' ]
    comments: [ '^/?compile(@[A-Za-z0-9._-]+)?$' ]
  pr_comment:
    types: [ created ]
    keyword: '^/?compile(@[A-Za-z0-9._-]+)?$'

env:
  org_name: ${{ vars.ORG_NAME }}
  repo_name: ${{ atomgit.event.repository.name}}
  MERGE_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.base_ref }}
  SOURCE_BRANCH: ${{ atomgit.head_ref }}
  obs_path: "${{ env.org_name }}/${{ env.repo_name }}/ci/package/${{ env.MERGE_ID }}"
  obs_smoke_path: "${{ env.obs_path }}/presmoke/2"
  online: ${{ vars.APPLY_LABEL }}

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: ${{ env.repo_name }}
              target_branch: ${{ env.TARGET_BRANCH }}
              comment: ${{ atomgit.event.comment.body }}
              token: ${{ secrets.TESTTOKEN }}
          -
            name: show_output
            run: |
              echo "Compile_Ascend_X86: ${{ steps.revise_image.outputs.Compile_Ascend_X86 }}"
              echo "Compile_Ascend_ARM: ${{ steps.revise_image.outputs.Compile_Ascend_ARM }}"
              echo "Compile_TorchDelegate_X86: ${{ steps.revise_image.outputs.Compile_TorchDelegate_X86 }}"
              echo "Compile_TorchDelegate_ARM: ${{ steps.revise_image.outputs.Compile_TorchDelegate_ARM }}"
              echo "UT_Test: ${{ steps.revise_image.outputs.UT_Test }}"
              echo "UT_TorchDelegate: ${{ steps.revise_image.outputs.UT_TorchDelegate }}"
              echo "Smoke_TorchDelegate_A2: ${{ steps.revise_image.outputs.Smoke_TorchDelegate_A2 }}"
        runs-on: ["self-hosted", "arch=x64", "spec=small"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pre:
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
      - type: auto
    fail-fast: true

  stage2:
    name: CodeCheck
    jobs:
      # 本仓无codecheck,以codecheck用codecheck_dt的规则集代替
      JOB_codecheck:
        name: CodeCheck
        uses: cann/.gitcode/.gitcode/workflows/codecheck_action.yml@master
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
      JOB_staticcheck_md_check:
        name: CodeCheck_staticcheck_md_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'md_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
    pre:
    - type: auto
    fail-fast: false

  stage3:
    name: Compile
    jobs:
      JOB_x86_compile:
        name: Compile_Ascend_X86
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86 }}
          arch: 'x64'
          package_name: 'cann_local_lm_x86_64.tar.gz'
      JOB_arm_compile:
        name: Compile_Ascend_ARM
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
          arch: 'arm64'
          package_name: 'cann_local_lm_aarch64.tar.gz'
      JOB_torch_delegate_x86_compile:
        name: Compile_TorchDelegate_X86
        uses: .gitcode/workflows/torch_delegate_compile_action.yml
        with:
          task_name: 'Compile_TorchDelegate_X86_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_TorchDelegate_X86 }}
          arch: 'x64'
      JOB_torch_delegate_arm_compile:
        name: Compile_TorchDelegate_ARM
        uses: .gitcode/workflows/torch_delegate_compile_action.yml
        with:
          task_name: 'Compile_TorchDelegate_ARM_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_TorchDelegate_ARM }}
          arch: 'arm64'
    pre:
    - type: auto
    fail-fast: false

  stage4:
    name: UT
    jobs:
      JOB_UT_Test:
        name: UT_Test
        uses: .gitcode/workflows/ut_action.yml
        with:
          ut_type: 'ophost'
          ut_package: 'coverage_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test }}
      JOB_torch_delegate_ut:
        name: UT_TorchDelegate
        uses: .gitcode/workflows/torch_delegate_ut_action.yml
        with:
          ut_type: 'torch_delegate'
          image_version: ${{ jobs.JOB_image.outputs.UT_TorchDelegate }}
    pre:
    - type: auto
    fail-fast: false

  stage5:
    name: Smoke
    jobs:
      JOB_torch_delegate_smoke:
        name: Smoke_TorchDelegate_A2
        uses: .gitcode/workflows/torch_delegate_smoke_action.yml
        with:
          whl_url: ${{ jobs.JOB_torch_delegate_arm_compile.outputs.whl_url }}
          image_version: ${{ jobs.JOB_image.outputs.Smoke_TorchDelegate_A2 }}
    pre:
    - type: auto
    fail-fast: false


post:
  jobs:
    job_post:
      name: Test_post
      uses: cann/.gitcode/.gitcode/workflows/post_action.yml@master
