[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-delegate"
dynamic = ["version"]
description = "torch.export-based heterogeneous deployment framework with pluggable NPU backends"
readme = "README.md"
requires-python = ">=3.10,<3.14"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
torch-delegate-config = "torch_delegate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["torch_delegate*"]

[tool.setuptools.package-data]
torch_delegate = ["inc/**", "lib/**"]
