# build.conf — 版本 + 路径默认值集中点
#
# 单一来源: _env_common.sh source 此文件, 各 set_env_*.sh / build.sh 经 _env_common 拿默认值.
# 环境变量优先: 任一变量若已在环境中设置, 此处不覆盖 (用 ${VAR:-default}).
# 收口替代散落在 AGENTS.md 的版本号 / 路径默认值.
#
# 不直接 source 此文件作 env (无 CANN / PYTHONPATH 设置); 用 set_env_*.sh.

# ── 版本 (信息性, 供 build.sh 对齐 / 校验) ──
TORCH_DELEGATE_VERSION=0.1.0
TORCH_VERSION=2.9.0
TORCHAIR_VERSION=0.1
CANN_VERSION=9.2.0

# ── 路径默认值 (可被环境变量覆盖) ──
PROJECT_ROOT="${PROJECT_ROOT:-/mnt/workspace/project/CANN-LM_5883}"
TORCHAIR_ROOT="${TORCHAIR_ROOT:-/mnt/workspace/torchair}"
TORCH_DELEGATE_HOME="${TORCH_DELEGATE_HOME:-/mnt/workspace/torch-delegate-harmony}"
CANN_SET_ENV="${CANN_SET_ENV:-/home/developer/Ascend/cann/set_env.sh}"
CONVERTER_PYTHON="${CONVERTER_PYTHON:-${TORCH_DELEGATE_HOME}/.venv/bin/python}"
DOPT_PYTHON="${DOPT_PYTHON:-/opt/buildtools/Python-3.11.4/bin/python3}"
STUBS_DIR="${STUBS_DIR:-${TORCHAIR_ROOT}/build/stubs}"
SOC_VERSION="${SOC_VERSION:-Ascend910_9362}"
